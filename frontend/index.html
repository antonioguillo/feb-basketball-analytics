<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEB Basketball Scouting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/min.css" integrity="sha512-l6l6Fh3j1t+6E/2hzQfDdFJoFdSvfNfog2vMZJ+ta4j+V4jMqqeF+wCiEJ5gZQQDnUJX86tZtE+VfFZ6TdrnIog==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #0d1117;
        --secondary: #21262d;
        --accent: #e6e04c;
        --muted: #8b949e;
        --card: #161b22;
        --border: #30363d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--primary);
        color: var(--muted);
        min-height: 100vh;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: #f2d049; }
      .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
      .header { 
        background: var(--secondary); 
        padding: 20px 0; 
        position: fixed; 
        width: 100%; 
        top: 0; 
        z-index: 100; 
      }
      .header .container { display: flex; justify-content: space-between; align-items: center; }
      .logo { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
      .nav a { margin-left: 20px; transition: color 0.2s; }
      .nav a:hover { color: #f2d049; }
      .main { margin-top: 80px; padding-bottom: 40px; }
      .section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin-bottom: 24px; }
      .section h2 { color: var(--white); margin-bottom: 20px; font-size: 1.25rem; }
      .loading { text-align: center; padding: 40px; color: var(--muted); }
      .error { background: #238636; color: white; padding: 10px; border-radius: 4px; margin: 10px 0; }
      .btn { 
        background: var(--accent); 
        color: var(--primary); 
        border: none; 
        padding: 8px 16px; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: 500; 
        transition: background 0.2s; 
      }
      .btn:hover { background: #f2d049; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
      .card { 
        background: var(--card); 
        border: 1px solid var(--border); 
        border-radius: 8px; 
        padding: 16px; 
        transition: transform 0.2s; 
      }
      .card:hover { transform: translateY(-2px); }
      .card h3 { margin-bottom: 8px; color: var(--white); }
      .metric { display: flex; justify-content: space-between; margin: 4px 0; color: var(--muted); }
      .code { background: var(--secondary); padding: 2px 4px; border-radius: 3px; font-size: 0.85rem; color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="container">
          <div class="logo">FEB Basketball Scouting</div>
          <nav class="nav">
            <a href="#jugadores">Jugadores</a>
            <a href="#lineups">Quintetos</a>
            <a href="#estadisticas">Líderes</a>
            <a href="#partidos">Partidos</a>
          </nav>
        </div>
      </header>
      
      <main class="main" id="root">
        <div class="loading">Cargando...</div>
      </main>
    </container>

    <script type="module" src="/main.js"></script>
  </body>
</html>
