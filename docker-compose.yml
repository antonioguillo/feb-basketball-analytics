version: "3.8"

services:
  # ============================================================
  # CAPA RAW: Data Lake (S3 compatible)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: feb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea los buckets de las capas del medallion (raw, bronze, silver, gold)
  minio-init:
    image: minio/mc:latest
    container_name: feb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/raw &&
      mc mb --ignore-existing local/bronze &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold &&
      mc mb --ignore-existing local/checkpoints &&
      mc mb --ignore-existing local/spark-warehouse &&
      mc mb --ignore-existing local/staging &&
      echo 'Buckets creados OK'"

  # ============================================================
  # CAPA DE PROCESAMIENTO: Spark + Delta Lake
  # ============================================================
  spark-master:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    container_name: feb-spark-master
    user: root
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_LOCAL_IP=spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-data:/opt/spark-data
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]

  spark-worker:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    container_name: feb-spark-worker
    user: root
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_LOCAL_IP=spark-worker
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - spark-data:/opt/spark-data
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

  # ============================================================
  # CAPA DE CONSUMO: ClickHouse (OLAP / SQL / dashboards)
  # ============================================================
  clickhouse:
    build:
      context: .
      dockerfile: infra/clickhouse/Dockerfile
    container_name: feb-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9004:9000"   # nativo (9000 ocupado por MinIO)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  minio_data:
  spark-data:
  clickhouse_data: