[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feb-basketball-analytics"
version = "0.1.0"
description = "Big Data Project for FEB Basketball Statistics Analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "lxml>=4.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
feb-scrape = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]